<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waiter Dashboard — Restaurant Live</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1014; --card: #171b22; --card2: #1f242d; --line: #2c323d;
    --text: #f1f3f6; --muted: #9aa3b2; --accent: #ff7a45; --accent2: #ffb88c;
    --green: #2ecc71; --yellow: #f5c542; --blue: #5b9dff; --purple: #b79cff; --red: #ff6161;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

  header {
    background: linear-gradient(135deg, #101722 0%, #1a2433 100%);
    border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; }
  header p { font-size: 12px; color: var(--muted); }
  .live-dot { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); }
  .live-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat b { font-size: 24px; display: block; }
  .stat span { font-size: 12px; color: var(--muted); }

  .head-row { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 10px; }
  .head-row h2 { font-size: 17px; }
  .head-row .hint { font-size: 12px; color: var(--muted); }
  .clear-btn { background: var(--card2); color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-size: 13px; }
  .clear-btn:hover { color: var(--text); }

  .board { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
  .o-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .o-card.fresh { animation: flash 1s ease-out; }
  @keyframes flash { 0% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: none; } }
  .o-head { display: flex; justify-content: space-between; align-items: center; }
  .o-head b { font-size: 16px; }
  .table-badge { background: var(--accent); color: #fff; border-radius: 8px; padding: 3px 10px; font-size: 12px; font-weight: 700; }
  .o-item { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 3px 0; }
  .o-item span:last-child { color: var(--text); font-weight: 600; }
  .o-total { border-top: 1px dashed var(--line); padding-top: 8px; display: flex; justify-content: space-between; font-size: 15px; }
  .o-total b { color: var(--accent2); }
  .o-time { font-size: 11px; color: var(--muted); }
  .status { padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .s-new { background: rgba(91,157,255,.15); color: var(--blue); }
  .s-preparing { background: rgba(245,197,66,.15); color: var(--yellow); }
  .s-ready { background: rgba(46,204,113,.15); color: var(--green); }
  .s-served { background: rgba(183,156,255,.15); color: var(--purple); }
  .s-paid { background: rgba(255,255,255,.08); color: var(--muted); }

  .actions { display: flex; gap: 6px; }
  .actions button {
    flex: 1; border: none; border-radius: 10px; padding: 9px 0;
    font-size: 13px; font-weight: 700; cursor: pointer; color: #101722; background: var(--muted);
  }
  .btn-accept { background: var(--blue) !important; color: #fff !important; }
  .btn-ready { background: var(--yellow) !important; }
  .btn-serve { background: var(--green) !important; }
  .btn-paid { background: var(--purple) !important; color: #fff !important; }
</style>
</head>
<body>
<header>
  <div style="font-size:28px">🧑‍🍳</div>
  <div><h1>Waiter Dashboard</h1><p>All tables · updates live automatically</p></div>
  <div class="live-dot"><i></i> LIVE</div>
</header>

<div class="wrap">
  <div class="stats">
    <div class="stat"><b id="stActive">0</b><span>Active orders</span></div>
    <div class="stat"><b id="stNew">0</b><span>Waiting to accept</span></div>
    <div class="stat"><b id="stReady">0</b><span>Ready to serve</span></div>
    <div class="stat"><b id="stRev">रु 0</b><span>Collected (paid)</span></div>
  </div>

  <div class="head-row">
    <h2>🧾 Live Orders</h2>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="hint" id="soundHint">🔔 sound on</span>
      <button class="clear-btn" id="clearBtn">🧹 Clear paid</button>
    </div>
  </div>
  <div class="board" id="board"></div>

  <div class="head-row"><h2>✅ Completed Today</h2></div>
  <div class="board" id="history"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const statusLabel = {
  new: '📝 New', preparing: '👩‍🍳 Preparing', ready: '🔔 Ready',
  served: '🍽️ Served', paid: '💰 Paid',
};
const nextAction = {
  new:      { label: '✅ Accept it', cls: 'btn-accept', to: 'preparing' },
  preparing:{ label: '🔔 Mark Ready', cls: 'btn-ready',  to: 'ready' },
  ready:    { label: '🍽️ Served',    cls: 'btn-serve',  to: 'served' },
  served:   { label: '💰 Paid',       cls: 'btn-paid',   to: 'paid' },
};

let orders = [];
let knownIds = new Set();
let firstLoad = true;
let soundOn = true;

function beep() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [880, 1100].forEach((f, i) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.frequency.value = f; o.type = 'sine';
      o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02 + i * 0.18);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35 + i * 0.18);
      o.start(ctx.currentTime + 0.02 + i * 0.18);
      o.stop(ctx.currentTime + 0.4 + i * 0.18);
    });
  } catch {}
}

function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function card(o, fresh) {
  const a = nextAction[o.status];
  const d = document.createElement('div');
  d.className = 'o-card' + (fresh ? ' fresh' : '');
  d.innerHTML = `
    <div class="o-head">
      <b>Order #${o.id}</b>
      <span class="table-badge">Table ${o.table}</span>
    </div>
    <div>
      ${o.items.map((i) => `<div class="o-item"><span>${i.qty} × ${i.name}</span><span>रु ${i.price * i.qty}</span></div>`).join('')}
    </div>
    <div class="o-total"><span>Total</span><b>रु ${o.total}</b></div>
    <div class="o-head">
      <span class="o-time" data-ts="${o.createdAt}">⏱ ${ago(o.createdAt)}</span>
      <span class="status s-${o.status}">${statusLabel[o.status]}</span>
    </div>
    ${a ? `<div class="actions"><button class="${a.cls}" data-id="${o.id}" data-to="${a.to}">${a.label}</button></div>` : ''}`;
  const btn = d.querySelector('.actions button');
  if (btn) btn.onclick = () => setStatus(o.id, btn.dataset.to);
  return d;
}

function render() {
  const active = orders.filter((o) => o.status !== 'paid').sort((a, b) => b.createdAt - a.createdAt);
  const done = orders.filter((o) => o.status === 'paid').sort((a, b) => b.createdAt - a.createdAt).slice(0, 12);

  const board = $('#board');
  board.innerHTML = '';
  active.forEach((o) => {
    board.appendChild(card(o, !firstLoad && !knownIds.has(o.id)));
  });
  if (!active.length) board.innerHTML = '<p style="color:var(--muted)">😴 No active orders. New ones pop here instantly.</p>';

  const hist = $('#history');
  hist.innerHTML = '';
  done.forEach((o) => hist.appendChild(card(o, false)));
  if (!done.length) hist.innerHTML = '<p style="color:var(--muted);font-size:14px">Nothing completed yet.</p>';

  // stats
  $('#stActive').textContent = active.length;
  $('#stNew').textContent = orders.filter((o) => o.status === 'new').length;
  $('#stReady').textContent = orders.filter((o) => o.status === 'ready').length;
  $('#stRev').textContent = 'रु ' + orders.filter((o) => o.status === 'paid').reduce((s, o) => s + o.total, 0);

  knownIds = new Set(orders.map((o) => o.id));
  firstLoad = false;
  // refresh relative times on next tick list
  setTimeout(() => document.querySelectorAll('.o-time').forEach((el) => { el.textContent = '⏱ ' + ago(+el.dataset.ts); }), 0);
}

async function setStatus(id, to) {
  await fetch(`/api/orders/${id}/status`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status: to }),
  });
}

$('#clearBtn').onclick = async () => {
  await fetch('/api/orders/clear-paid', { method: 'POST' });
};
$('#soundHint').onclick = () => {
  soundOn = !soundOn;
  $('#soundHint').textContent = soundOn ? '🔔 sound on' : '🔕 sound off';
};

async function init() {
  orders = await fetch('/api/orders').then((r) => r.json());
  render();
  const es = new EventSource('/api/events');
  es.addEventListener('orders', (e) => {
    const prev = orders;
    orders = JSON.parse(e.data);
    render();
    const freshNew = orders.some((o) => o.status === 'new' && !prev.some((p) => p.id === o.id));
    if (freshNew) beep();
  });
  setInterval(render, 30000); // keep time stamps fresh
}
init();
</script>
</body>
</html>
