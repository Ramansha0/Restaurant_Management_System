<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6347"/>
      <stop offset="1" stop-color="#e55336"/>
    </linearGradient>
  </defs>
  <!-- brand rounded tile -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- white plate + rim -->
  <circle cx="32" cy="34" r="19" fill="#ffffff"/>
  <circle cx="32" cy="34" r="12.7" fill="none" stroke="#ffcdb6" stroke-width="3.2"/>
  <!-- Raman monogram -->
  <text x="32" y="40" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#e55336" text-anchor="middle">R</text>
  <!-- steam swirls -->
  <path d="M25 13 q3.5 -5 0 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M39 13 q-3.5 -5 0 -9" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
